aid: aatmunn
name: Aatmunn
description: >-
  Aatmunn (formerly Guardhat, founded 2014 in Detroit and headquartered in
  Livonia, Michigan) is an industrial safety and asset intelligence platform for
  frontline and deskless workers. Its SPANR / Industrial Internet of People
  (IIoP) platform unifies workers, workplaces, and assets into one real-time
  system, connecting devices from any manufacturer and layering AI-driven
  insights for predictive hazard detection, emergency response, inspections, and
  compliance. Products include Inspections, Lone Worker Safety, Human Condition
  Monitoring, Gas Detection, Control Access Zoning, and Asset Tracking, serving
  250+ companies across high-risk industries such as oil & gas, chemicals,
  mining & infrastructure, manufacturing, utilities, and warehousing & logistics.
  This profile was surfaced as a General Catalyst portfolio company and is
  maintained by the API Evangelist enrichment pipeline; Aatmunn publishes no
  public developer API, SDKs, or OpenAPI at this time.
